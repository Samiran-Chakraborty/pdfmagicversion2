    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-12 pt-32 flex-grow w-full">
        <!-- Back to Tools Button -->
        <div class="mb-6 text-left">
            <a href="tools.html?category=pdf" class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 hover:text-indigo-600 hover:border-indigo-200 font-semibold text-sm shadow-sm transition-all hover:-translate-x-1 group">
                <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>

        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 md:p-12 text-center">

            <div class="mb-8">
                <div
                    class="w-20 h-20 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-6 text-indigo-600">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-slate-900 mb-2">PDF File Compressor</h1>

            <!-- Upload Zone -->
            <input type="file" id="file-input" accept=".pdf, application/pdf" class="hidden">
            <div id="upload-zone"
                class="rounded-2xl p-10 cursor-pointer mb-8 group hover:bg-indigo-50/50 border-2 border-dashed border-slate-200 hover:border-indigo-300 transition-all">

                    <svg class="h-12 w-12 text-slate-400 mx-auto mb-4 group-hover:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-lg font-medium text-slate-700 mb-1">Click to upload or drag and drop</p>
                    <p class="text-sm text-slate-400">Supported format: .pdf</p>
                </div>
            </div>

            <!-- Editor & Controls Section -->
            <div id="editor-section" class="hidden text-left animate-fade-in space-y-6">

                    <button id="remove-btn" class="p-2 bg-red-50 text-red-500 rounded-xl hover:bg-red-100 font-semibold text-sm">Remove</button>

                <!-- One-click Compress Button -->
                <button id="process-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                    Compress PDF
                </button>

                <!-- Result Area -->
                <div id="result-area" class="hidden bg-emerald-50 border border-emerald-200 p-6 rounded-2xl text-center space-y-4">
                    <h3 class="font-bold text-emerald-900 text-lg">PDF Compressed Successfully!</h3>
                    <p class="text-sm text-emerald-700">New PDF size: <span id="new-size-display" class="font-bold"></span></p>
                    <button id="download-btn" class="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-700 transition-colors shadow-md">

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-slate-500 font-medium">© 2026 PDF Magic. Designed for Privacy.</p>
        </div>
    </footer>

    <script src="js/main.js?v=2.0"></script>
    <script>
        const { PDFDocument } = PDFLib;

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const editorSection = document.getElementById('editor-section');
        const fileName = document.getElementById('file-name');
        const originalInfo = document.getElementById('original-info');
        const processBtn = document.getElementById('process-btn');
        const resultArea = document.getElementById('result-area');
        const newSizeDisplay = document.getElementById('new-size-display');
        const downloadBtn = document.getElementById('download-btn');
        const removeBtn = document.getElementById('remove-btn');

        let currentFile = null;
        let compressedBlob = null;

        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('click', (e) => e.stopPropagation());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('active'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('active'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('active');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        removeBtn.addEventListener('click', () => {
            currentFile = null;
            compressedBlob = null;
            fileInput.value = '';
            editorSection.classList.add('hidden');
            resultArea.classList.add('hidden');
            uploadZone.classList.remove('hidden');
        });

        function handleFile(file) {
            if (file.type !== 'application/pdf' && !file.name.endsWith('.pdf')) {
                alert('Please upload a PDF file.');
                return;
            }

            currentFile = file;
            fileName.textContent = file.name;
            originalInfo.textContent = `Original Size: ${(file.size / 1024).toFixed(1)} KB`;
            uploadZone.classList.add('hidden');
            resultArea.classList.add('hidden');
            editorSection.classList.remove('hidden');
        }

        processBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            processBtn.disabled = true;
            processBtn.textContent = 'Compressing PDF Pages...';

            try {
                const arrayBuffer = await currentFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const newPdfDoc = await PDFDocument.create();

                const quality = 0.60;
                const renderScale = 0.9;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const origViewport = page.getViewport({ scale: 1.0 });

                    const renderViewport = page.getViewport({ scale: renderScale });
                    const canvas = document.createElement('canvas');
                    canvas.width = renderViewport.width;
                    canvas.height = renderViewport.height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;

                    const imgBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
                    const imgBuffer = await imgBlob.arrayBuffer();
                    const imgBytes = new Uint8Array(imgBuffer);
                    const jpegImage = await newPdfDoc.embedJpg(imgBytes);

                    const newPage = newPdfDoc.addPage([origViewport.width, origViewport.height]);
                    newPage.drawImage(jpegImage, {
                        x: 0,
                        y: 0,
                        width: origViewport.width,
                        height: origViewport.height
                    });
                }

                const pdfBytes = await newPdfDoc.save();
                compressedBlob = new Blob([pdfBytes], { type: 'application/pdf' });

                const origKb = (currentFile.size / 1024).toFixed(1);
                const newKb = (compressedBlob.size / 1024).toFixed(1);
                const reduction = Math.round((1 - compressedBlob.size / currentFile.size) * 100);

                newSizeDisplay.textContent = `${newKb} KB (${reduction > 0 ? reduction + '% reduced' : 'optimized'})`;
                resultArea.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert('Error compressing PDF.');
            }

            processBtn.disabled = false;
            processBtn.textContent = 'Compress PDF';
        });

        downloadBtn.addEventListener('click', () => {
            if (!compressedBlob) return;
            const baseName = currentFile.name.replace(/\.[^/.]+$/, "");
            downloadBlob(compressedBlob, `${baseName}-compressed.pdf`);
        });
    </script>
</body>
